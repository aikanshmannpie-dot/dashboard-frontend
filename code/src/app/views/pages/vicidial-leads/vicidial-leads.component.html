<div class="pageContainer">
	<div class="pageTopBar">
		<h2 style="padding: 10px 0px; float: left">Push to Vicidial</h2>
		<div ngbDropdown class="dropdown searcBar threeColumn">
			<div>
				<input
					type="text"
					class="btn btn-default dropdown-toggle date-select-box"
					ngxDaterangepickerMd
					startKey="start"
					endKey="end"
					[(ngModel)]="model1"
				/>
			</div>
			<div class="">
				<select
					style="margin-left: 5px"
					class="form-control dropdown-select-box"
					(change)="ChangingValue($event)"
				>
					<option value="">Select Campaign</option>
					<option
						*ngFor="let item of siteListingData"
						value="{{ item.id }}"
					>
						{{ item.name }}
					</option>
				</select>
				<!-- <label style="color: red">This field is required</label> -->
			</div>
			<button
				style="margin-left: 5px"
				class="btn btn-default dropdown-toggle"
				id="ddllogout"
				type="button"
				(click)="searchRange()"
				[disabled]="
					!this.isSelected || !this.model1.start || !this.model1.end
				"
			>
				Pust Leads
			</button>
		</div>
	</div>
	<div ngbDropdown class="dropdown topBarList" *ngIf="avaible">
		<kendo-pdf-export #pdf margin="2cm">
			<mat-table
				class="lmat-elevation-z8"
				matTableExporter
				#table
				[dataSource]="dataSource"
				matSort
				#matSort="matSort"
				matSortActive="id"
				matSortDirection="asc"
				matSortDisableClear
				(matSortChange)="sortColumn($event)"
			>
				<ng-container matColumnDef="campaign_name">
					<mat-header-cell *matHeaderCellDef mat-sort-header
						>Campaign Name</mat-header-cell
					>
					<mat-cell *matCellDef="let element; let i = index">
						{{ element.campaign_name }}
					</mat-cell>
				</ng-container>

				<ng-container matColumnDef="receive_date">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						Pushed Date
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.receive_date }}
					</mat-cell>
				</ng-container>

				<ng-container matColumnDef="from_date">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						Form Date
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.from_date }}
					</mat-cell>
				</ng-container>

				<ng-container matColumnDef="to_date">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						To Date
					</mat-header-cell>

					<mat-cell *matCellDef="let element">
						{{ element.to_date }}
					</mat-cell>
				</ng-container>

				<ng-container matColumnDef="totalcount">
					<mat-header-cell *matHeaderCellDef mat-sort-header
						>Total Count
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.totalcount }}
					</mat-cell>
				</ng-container>
				<mat-header-row
					*matHeaderRowDef="displayedColumns"
				></mat-header-row>
				<div>
					<mat-row
						*matRowDef="
							let row;
							columns: displayedColumns;
"
					></mat-row>
				</div>
			</mat-table>

			<!-- <div style="text-align: center
        ;">
            <h3>Data not found!</h3>
        </div> -->
		</kendo-pdf-export>
	</div>
	<div *ngIf="loading" style="text-align: center">
		<img
			style="padding: 10px; height: 100px"
			src="assets/images/loader.gif"
		/>
	</div>
	<!-- start: BOTTOM -->
	<div class="mat-table__bottom">
		<!-- <button (click)="nextData()" class="button-next-pre">Next</button>
    <button (click)="previusData()" class="button-next-pre" >Previous</button> -->
		<mat-paginator
			[pageSize]="10"
			[pageSizeOptions]="[10, 20, 25, 100]"
			[showFirstLastButtons]="true"
		></mat-paginator>
	</div>
	<div style="text-align: center">
		<h3>{{ message }}</h3>
		<span>{{ apiresposne }}</span>
	</div>
</div>
