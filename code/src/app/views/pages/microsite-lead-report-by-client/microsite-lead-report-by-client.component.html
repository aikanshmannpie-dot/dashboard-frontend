<div class="dash-page-container">

  <!-- ══════════════════════════════════════════
       FILTER AND HEADER CARD
       ══════════════════════════════════════════ -->
  <mat-card class="filter-card">
    <mat-card-header class="filter-card-header">
      <div class="filter-card-title-row">
        <mat-card-title class="dash-title">Lead Report by API Client</mat-card-title>
        <mat-card-subtitle class="dash-subtitle">Analysis and visualization of accepted vs rejected lead counts per
          client</mat-card-subtitle>
      </div>

      <!-- Action Toggle button (Mobile calendar trigger) -->
      <button mat-icon-button (click)="searchButton()" class="mobile-calendar-btn" aria-label="Search filter">
        <mat-icon>calendar_month</mat-icon>
      </button>

      <!-- Search Filters Inline Row -->
      <div class="filter-card-actions" [class.filter-card-actions--show]="!search">
        <div class="filters-wrapper">

          <!-- Single Unified Date Range Picker -->
          <div class="filter-item">
            <label class="filter-label">Date Range</label>
            <div class="date-picker-input-wrapper">
              <mat-icon class="calendar-icon">calendar_today</mat-icon>
              <input
                type="text"
                class="form-control date-select-input"
                ngxDaterangepickerMd
                [opens]="'right'"
                startKey="start"
                endKey="end"
                [ranges]="ranges"
                [showCustomRangeLabel]="true"
                [alwaysShowCalendars]="true"
                [(ngModel)]="model1"
                placeholder="Select date range"
              />
            </div>
          </div>

          <!-- Apply Button -->
          <div class="filter-item">
            <label class="filter-label">&nbsp;</label>
            <button mat-raised-button color="primary" (click)="searchRange(); searchButton()" class="filter-btn-submit">
              <mat-icon>filter_list</mat-icon>
              <span>Search</span>
            </button>
          </div>

        </div>
      </div>
    </mat-card-header>
  </mat-card>

  <!-- ══════════════════════════════════════════
       HIGHCHARTS REPORT CARD
       ══════════════════════════════════════════ -->
  <mat-card class="dash-mat-card chart-card top-border-1">
    <mat-card-content class="chart-card-content">
      <div class="chart-container-wrapper">
        <figure class="highcharts-figure">
          <div id="activeLastWeek" class="clean-chart-container"></div>
        </figure>
      </div>

      <!-- Loading Spinner overlay -->
      <div *ngIf="loading" class="loader-overlay">
        <mat-spinner diameter="40"></mat-spinner>
        <span class="loader-text">Analyzing client metrics...</span>
      </div>
    </mat-card-content>
  </mat-card>

</div>
