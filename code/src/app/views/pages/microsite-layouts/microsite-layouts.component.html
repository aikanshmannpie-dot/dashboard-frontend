<div class="pageContainer">
  <div class="pageTopBar">
    <h2 style="padding: 10px 0px; float: left">Microsite Layouts</h2>
  </div>

  <div ngbDropdown class="dropdown topBarList" *ngIf="avaible">
    <button class="downloadIconBtn" (click)="downloadButton()">
      <img src="assets/images/download.svg" />
    </button>
    <div
      class="downloadBtnsBox"
      [ngClass]="download ? 'webDownloadBtns' : 'mobileDownloadBtns'"
    >
      <button
        class="btn btn-default dropdown-toggle"
        id="ddllogout"
        type="button"
        (click)="exporter.exportTable('csv', { fileName: 'SourceReport ' })"
      >
        <img src="assets/images/csv.svg" /> CSV
      </button>
      <button
        class="btn btn-default dropdown-toggle"
        id="ddllogout"
        type="button"
        kendo-button
        (click)="pdf.saveAs('SourceReport.pdf')"
      >
        <img src="assets/images/pdf.svg" /> PDF
      </button>
      <button
        class="btn btn-default dropdown-toggle"
        id="ddllogout"
        type="button"
        [useExistingCss]="true"
        printSectionId="pdfTable"
        ngxPrint
      >
        <img src="assets/images/print.svg" /> Print
      </button>
      <button
        class="btn btn-default dropdown-toggle"
        id="ddllogout"
        type="button"
        (click)="exporter.exportTable('xls', { fileName: 'SourceReport ' })"
      >
        <img src="assets/images/excel.svg" /> Excel
      </button>
    </div>
    <div fxLayout fxLayoutAlign="right right" class="div-right-align">
      <mat-form-field fxFlex="40%">
        <input
          matInput
          type="text"
          (keyup)="doFilter($event.target.value)"
          placeholder="Search:"
        />
      </mat-form-field>
    </div>
  </div>

  <div class="mat-table__wrapper tableMobileView" id="pdfTable" #pdfTable>
    <kendo-pdf-export #pdf margin="2cm">
      <mat-table
        class="lmat-elevation-z8"
        matTableExporter
        #table
        [dataSource]="dataSource"
        matSort
        #matSort="matSort"
        matSortActive="id"
        matSortDirection="asc"
        matSortDisableClear
        (matSortChange)="sortColumn($event)"
        #exporter="matTableExporter"
      >
        <ng-container matColumnDef="index">
          <mat-header-cell *matHeaderCellDef> Index </mat-header-cell>
          <mat-cell
            *matCellDef="let element; let i = index"
            class="firstCellCollumn"
            >{{ i + 1 }}<span class="d-print-none">Index</span></mat-cell
          >
        </ng-container>
        <ng-container matColumnDef="site_name">
          <mat-header-cell *matHeaderCellDef mat-sort-header
            >Site Name</mat-header-cell
          >
          <mat-cell *matCellDef="let element" class="secondCellCollumn">
            {{ element.site_name }}
            <span class="d-print-none">Site Name</span>
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="theme">
          <mat-header-cell *matHeaderCellDef mat-sort-header>
            Theme
          </mat-header-cell>
          <mat-cell *matCellDef="let element">
            {{ element.theme }}
            <span class="d-print-none">Theme</span>
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="survey_layout">
          <mat-header-cell *matHeaderCellDef mat-sort-header>
            Survey Layout
          </mat-header-cell>
          <mat-cell *matCellDef="let element">
            {{ element.survey_layout }}
            <span class="d-print-none">Survey Layout</span>
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="domain">
          <mat-header-cell *matHeaderCellDef mat-sort-header
            >Preview</mat-header-cell
          >
          <mat-cell *matCellDef="let element" class="secondCellCollumn">
            <a href="https://{{ element.domain }}" class="link" target="_blank"
              >Preview</a
            >
            <span class="d-print-none">Preview</span>
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <div>
          <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        </div>
      </mat-table>

      <div *ngIf="loading" style="text-align: center">
        <img
          style="padding: 10px; height: 100px"
          src="assets/images/loader.gif"
        />
      </div>
      <!-- <div style="text-align: center
        ;">
            <h3>Data not found!</h3>
        </div> -->
    </kendo-pdf-export>
  </div>

  <!-- start: BOTTOM -->
  <div class="mat-table__bottom">
    <!-- <button (click)="nextData()" class="button-next-pre">Next</button>
    <button (click)="previusData()" class="button-next-pre" >Previous</button> -->
    <mat-paginator
      [pageSize]="20"
      [pageSizeOptions]="[10, 20, 25, 100]"
      [showFirstLastButtons]="true"
    >
    </mat-paginator>
  </div>
</div>
