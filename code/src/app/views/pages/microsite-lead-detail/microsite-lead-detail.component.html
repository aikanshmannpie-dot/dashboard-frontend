<div class="pageContainer">
  <div class="pageTopBar">
    <h2 style="padding: 10px 0px; float: left">Lead Detail </h2>
  </div>

 
  <div class="mat-table__wrapper tableMobileView" id="pdfTable" #pdfTable>
    <kendo-pdf-export #pdf margin="2cm">
      <mat-table
        class="lmat-elevation-z8"
        matTableExporter
        #table
        [dataSource]="dataSource"
        matSort
        #matSort="matSort"
        matSortActive="id"
        matSortDirection="asc"
        matSortDisableClear
        (matSortChange)="sortColumn($event)"
      >
        
        <ng-container matColumnDef="payload">
          <mat-header-cell *matHeaderCellDef mat-sort-header
            >Payload
          </mat-header-cell>
          <mat-cell *matCellDef="let element">
            {{ element.payload }}
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="payload_type">
          <mat-header-cell *matHeaderCellDef mat-sort-header
            >Payload Type
          </mat-header-cell>
          <mat-cell *matCellDef="let element">
            {{ element.payload_type }}
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <div>
          <mat-row
            *matRowDef="
              let row;
              columns: displayedColumns;
              columns: displayedColumns2
            "
          ></mat-row>
        </div>
      </mat-table>

      <div *ngIf="loading" style="text-align: center">
        <img
          style="padding: 10px; height: 100px"
          src="assets/images/loader.gif"
        />
      </div>
      <!-- <div style="text-align: center
        ;">
            <h3>Data not found!</h3>
        </div> -->
    </kendo-pdf-export>
  </div>

  <!-- start: BOTTOM -->
  <div class="mat-table__bottom">
    <!-- <button (click)="nextData()" class="button-next-pre">Next</button>
    <button (click)="previusData()" class="button-next-pre" >Previous</button> -->
    <mat-paginator
      [pageSize]="20"
      [pageSizeOptions]="[10, 20, 25, 100]"
      [showFirstLastButtons]="true"
    ></mat-paginator>
  </div>
</div>
