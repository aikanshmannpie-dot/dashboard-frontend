<div class="pageContainer">
	<div class="pageTopBar">
		<h2 style="padding: 10px 0px; float: left">Report by Affiliate</h2>
		<div ngbDropdown class="dropdown searcBar threeColumn">
			<input type="text" class="btn btn-default dropdown-toggle date-select-box" ngxDaterangepickerMd
				startKey="start" endKey="end" [(ngModel)]="model1" />
			<input type="text" class="btn btn-default dropdown-toggle date-select-box" ngxDaterangepickerMd
				startKey="start" endKey="end" [ranges]="ranges" [(ngModel)]="model1" />
			<!-- <input matInput type="text" class="search-site-input" [(ngModel)]="siteName" placeholder="Search Site Name:"> -->
			<button class="btn btn-default dropdown-toggle" id="ddllogout" type="button" (click)="searchRange()">
				Search
			</button>
		</div>
	</div>

	<div ngbDropdown class="dropdown topBarList" *ngIf="avaible">
		<button class="btn btn-default dropdown-toggle" id="ddllogout" type="button" (click)="
				exporter.exportTable('csv', { fileName: 'AffiliateReport' })
			">
			CSV
		</button>
		<button class="btn btn-default dropdown-toggle" id="ddllogout" type="button" kendo-button
			(click)="pdf.saveAs('AffiliateReport.pdf')">
			PDF
		</button>
		<button class="btn btn-default dropdown-toggle" id="ddllogout" type="button" [useExistingCss]="true"
			printSectionId="pdfTable" ngxPrint>
			Print
		</button>
		<button class="btn btn-default dropdown-toggle" id="ddllogout" type="button" (click)="
				exporter.exportTable('xls', { fileName: 'AffiliateReport ' })
			">
			Excel
		</button>
		<div fxLayout fxLayoutAlign="right right" class="div-right-align">
			<mat-form-field fxFlex="40%">
				<input matInput type="text" (keyup)="doFilter($event.target.value)" placeholder="Search:" />
			</mat-form-field>
		</div>
	</div>

	<div class="mat-table__wrapper" id="pdfTable" #pdfTable>
		<kendo-pdf-export #pdf margin="2cm">
			<mat-table class="lmat-elevation-z8" matTableExporter #table [dataSource]="dataSource" matSort
				#matSort="matSort" matSortActive="id" matSortDirection="asc" matSortDisableClear
				(matSortChange)="sortColumn($event)" #exporter="matTableExporter">
				<ng-container matColumnDef="index">
					<mat-header-cell *matHeaderCellDef> Index </mat-header-cell>
					<mat-cell *matCellDef="let element; let i = index;">{{i +1}}</mat-cell>
				</ng-container>
				<ng-container matColumnDef="Site_name">
					<mat-header-cell *matHeaderCellDef mat-sort-header>Site Name</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.site_name }}
					</mat-cell>
				</ng-container>
				<ng-container matColumnDef="affiliate">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						Affiliate
					</mat-header-cell>
					<mat-cell *matCellDef="let element" style="overflow-wrap: anywhere;">
						{{ element.affiliate }}
					</mat-cell>
				</ng-container>
				<ng-container matColumnDef="conversion">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						Conversion
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.conversion }}
					</mat-cell>
				</ng-container>
				<mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
				<div>
					<mat-row *matRowDef="
							let row;
							columns: displayedColumns;
						"></mat-row>
				</div>
			</mat-table>

			<div *ngIf="loading" style="text-align: center">
				<img style="padding: 10px; height: 100px" src="assets/images/loader.gif" />
			</div>
			<!-- <div style="text-align: center
        ;">
            <h3>Data not found!</h3>
        </div> -->
		</kendo-pdf-export>
	</div>

	<!-- start: BOTTOM -->
	<div class="mat-table__bottom">
		<!-- <button (click)="nextData()" class="button-next-pre">Next</button>
    <button (click)="previusData()" class="button-next-pre" >Previous</button> -->
		<mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 20, 25, 100]" [showFirstLastButtons]="true">
		</mat-paginator>
	</div>
</div>
