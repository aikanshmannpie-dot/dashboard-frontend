<div class="pageContainer">
  <div class="pageTopBar">
    <h2 style="padding: 10px 0px; float: left">Microsite lead Report by domains</h2>
    <button class="calendarBtn">
      <img src="assets/images/calendar.svg" />
    </button>
    <!-- <div class="searchBox" [ngClass]="search ? 'searchBoxHide' : 'searchBoxShow'">
      <div ngbDropdown class="dropdown searcBar threeColumn">
        <select class="form-control dropdown-select-box" (change)="ChangingValue($event)">
          <option value="undefined">Search By Site Name</option>
          <option *ngFor="let item of siteListingData" value="{{ item.id }}">
            {{ item.name }}
          </option>
        </select>
      </div>
    </div> -->
  </div>
  <div class="accordion" id="accordionExample">
    <div class="card" *ngFor="let item of siteListingData">
      <div class="card-header" id="headingOne">
        <h5 class="mb-0 p-4">
          {{item.name}}
          <span *ngIf="item.status" class="badge badge-success">Active</span>
          <span *ngIf="!item.status" class="badge badge-danger">In-Active</span>
        </h5>
      </div>

      <div id={{item.id}} class="collapse show" aria-labelledby="headingOne" data-parent="#accordionExample">
        <div class="card-body">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Leads</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngIf="getLeadsOfDomain(item.id).length === 0">
                <td colspan="2">No Record Available</td>
              </tr>
              <tr *ngFor="let lead of getLeadsOfDomain(item.id)">
                <td [ngClass]="{'table-danger': lead.c<1}">{{lead.day}}</td>
                <td [ngClass]="{'table-danger': lead.c<1}">{{lead.c}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="loading" style="text-align: center">
    <img style="padding: 10px; height: 100px" src="assets/images/loader.gif" />
  </div>
</div>
