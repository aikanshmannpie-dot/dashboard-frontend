<div class="pageContainer">
	<div class="pageTopBar">
		<h2 style="padding: 10px 0px; float: left">Report By Campaigns</h2>
		<div ngbDropdown class="dropdown searcBar">
			<input
				type="text"
				class="btn btn-default dropdown-toggle"
				ngxDaterangepickerMd
				startKey="start"
				endKey="end"
				[(ngModel)]="model1"
			/>
			<input
				type="text"
				class="btn btn-default dropdown-toggle"
				ngxDaterangepickerMd
				startKey="start"
				endKey="end"
				[ranges]="ranges"
				[(ngModel)]="model1"
			/><select
				class="form-control dropdown-select-box"
				(change)="ChangingValue($event)"
				*ngIf="report_type == 2"
			>
				<option value="undefined">Search By Source</option>
				<option
					*ngFor="let item of metasourceListingData"
					value="{{ item.id }}"
				>
				<div *ngIf="item.name!=null">	{{ item.name }}</div>
				</option>
			</select>
			<button
				class="btn btn-default dropdown-toggle"
				id="ddllogout"
				type="button"
				(click)="searchRange()"
			>
				Search
			</button>
		</div>
	</div>

	<div ngbDropdown class="dropdown topBarList" *ngIf="avaible">
		<button
			class="btn btn-default dropdown-toggle"
			id="ddllogout"
			type="button"
			(click)="
				exporter.exportTable('csv', {
					fileName: 'Acquirely  Dashboard '
				})
			"
		>
			CSV
		</button>
		<button
			class="btn btn-default dropdown-toggle"
			id="ddllogout"
			type="button"
			(click)="pdf.saveAs('Acquirely  Dashboard.pdf')"
		>
			PDF
		</button>
		<button
			class="btn btn-default dropdown-toggle"
			id="ddllogout"
			type="button"
			[useExistingCss]="true"
			printSectionId="pdfTable"
			ngxPrint
		>
			Print
		</button>
		<button
			class="btn btn-default dropdown-toggle"
			id="ddllogout"
			type="button"
			(click)="
				exporter.exportTable('xls', {
					fileName: 'Acquirely  Dashboard '
				})
			"
		>
			Excel
		</button>
		<div fxLayout fxLayoutAlign="right right" class="div-right-align">
			<mat-form-field fxFlex="40%">
				<input
					matInput
					type="text"
					(keyup)="doFilter($event.target.value)"
					placeholder="Search:"
				/>
			</mat-form-field>
		</div>
	</div>

	<div class="mat-table__wrapper" id="pdfTable" #pdfTable>
		<kendo-pdf-export #pdf margin="2cm">
			<mat-table
				class="lmat-elevation-z8"
				matTableExporter
				#table
				[dataSource]="dataSource"
				matSort
				#matSort="matSort"
				matSortActive="id"
				matSortDirection="asc"
				matSortDisableClear
				#exporter="matTableExporter"
				(matSortChange)="sortColumn($event)"
			>
				<ng-container matColumnDef="Sr.No">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						Sr.No</mat-header-cell
					>
					<mat-cell *matCellDef="let element; let i = index">
						{{ i + 1 }}
					</mat-cell>
				</ng-container>

				<ng-container matColumnDef="campaignid">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						Campaign ID
						<!-- <input matInput type="text" [ngModel]="globalFilter" (keyup)="doFilterAffilateName($event.target.value)"
                    placeholder="Search:"> -->
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.campaignid }}
					</mat-cell>
				</ng-container>

				<ng-container matColumnDef="campaign_name">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						Campaign Name
						<!-- <input matInput type="text" [ngModel]="totalcountFilter"
                    (keyup)="doFilterEmailName($event.target.value)" placeholder="Search:"> -->
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.campaign_name }}
					</mat-cell>
				</ng-container>

				<ng-container matColumnDef="totalcount">
					<mat-header-cell *matHeaderCellDef mat-sort-header
						>Unique Leads
						<!-- <input matInput type="text" [ngModel]="signUpFilter" (keyup)="doFilterSignupName($event.target.value)"
                    placeholder="Search:"> -->
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.totalcount }}
					</mat-cell>
				</ng-container>
				<ng-container matColumnDef="sumofleads">
					<mat-header-cell *matHeaderCellDef mat-sort-header
						>Total Revenue (A$)
						<!-- <input matInput type="text" [ngModel]="revtotalFilter" (keyup)="doFilterRevtotal($event.target.value)"
                    placeholder="Search:"> -->
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						<span
							[ngClass]="{
								whiteCol: element.sumofleads > 0,
								redCol: element.sumofleads == 0
							}"
							>{{ element.sumofleads }}</span
						>
					</mat-cell>
				</ng-container>
				<ng-container matColumnDef="arpeall">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						ARPE
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.arpeall }}
					</mat-cell>
				</ng-container>
				<ng-container matColumnDef="gp">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						GP (A$)
						<!-- <input matInput type="text" [ngModel]="payoutFilter" (keyup)="doFilterPayout($event.target.value)"
                    placeholder="Search:"> -->
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.gp }}
					</mat-cell>
				</ng-container>
				<ng-container matColumnDef="gpper">
					<mat-header-cell *matHeaderCellDef mat-sort-header>
						GP%
						<!-- <input matInput type="text" [ngModel]="revtotalFilter" (keyup)="doFilterRevtotal($event.target.value)"
                    placeholder="Search:"> -->
					</mat-header-cell>
					<mat-cell *matCellDef="let element">
						{{ element.gpper }}
					</mat-cell>
				</ng-container>

				<mat-header-row
					*matHeaderRowDef="displayedColumns"
				></mat-header-row>
				<div>
					<mat-row
						*matRowDef="let row; columns: displayedColumns"
					></mat-row>
				</div>
			</mat-table>

			<div *ngIf="loading" style="text-align: center">
				<img
					style="padding: 10px; height: 100px"
					src="assets/images/loader.gif"
				/>
			</div>
			<div class="mat-table__message" *ngIf="areNoRecords && !loading">
				No records found
			</div>
		</kendo-pdf-export>
	</div>

	<!-- start: BOTTOM -->
	<div class="mat-table__bottom">
		<mat-paginator
			[pageSize]="10"
			[pageSizeOptions]="[10, 20, 25, 100]"
			[showFirstLastButtons]="true"
		></mat-paginator>
	</div>
</div>
